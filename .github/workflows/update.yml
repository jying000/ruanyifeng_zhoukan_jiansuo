name: 构建周刊索引

on:
  schedule:
    # 北京时间每周四 21:00 执行 = UTC 周四 13:00
    # 周刊每周五发布，但作者随后可能修正出处/链接错误。
    # 周四晚只拉取「上一个周五」发布的那一期（已发布满一周、大概率已稳定），
    # 不拉当周周五刚发布、可能尚未修正的最新一期，也不重拉更早历史（脚本按精确发表日期判断）。
    - cron: '0 13 * * 4'
  workflow_dispatch: {}  # 允许手动触发

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: 提交更新的索引
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- site/index.json; then
            echo "索引无变化，跳过提交。"
          else
            git add site/index.json
            git commit -m "chore: 增量更新周刊索引（$(date -u +%Y-%m-%d)）"
            git push
          fi
