name: Update weekly index

on:
  schedule:
    # 每周五 08:15 北京时间 = 00:15 UTC（GitHub Actions 使用 UTC）。
    # 阮一峰约北京时间 08:08 发布周刊，故 08:15 通常可抓到最新一期。
    # 若担心偶发延迟发布，可改为 '30 0 * * 5'（09:30 北京时间）。
    - cron: '15 0 * * 5'
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build index (incremental)
        run: node scripts/build.mjs

      - name: Commit updated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain site/index.json)" ]; then
            git add site/index.json
            git commit -m "chore: auto-update weekly index [skip ci]"
            git push
          else
            echo "No changes to index.json"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
